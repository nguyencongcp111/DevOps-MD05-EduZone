# Nginx reverse proxy cho EduZone — cài trực tiếp trên máy chủ (không chạy trong Docker).
# __DOMAIN__ được scripts/setup-https.sh thay bằng tên miền thật.
#
#   https://__DOMAIN__/api/...     -> gateway   127.0.0.1:8080
#   https://__DOMAIN__/grafana/... -> Grafana   127.0.0.1:3000
#
# Gateway và Grafana chỉ lắng nghe trên 127.0.0.1, nên từ Internet chỉ còn 80 và 443.

# ---- HTTP: chỉ phục vụ xác minh Let's Encrypt, còn lại chuyển sang HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # Trang gốc: chuyển tới danh sách khoá học
    location = / {
        return 302 /api/courses;
    }

    # API nghiệp vụ -> gateway
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # Grafana (chạy dưới đường dẫn con /grafana/, cần WebSocket cho live)
    location /grafana/ {
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:3000;
    }

    # Mọi đường dẫn khác (kể cả /actuator, /internal) không mở ra ngoài
    location / {
        return 404;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
