# Cụm giám sát EduZone: Prometheus + node-exporter + Grafana.
# Gắn vào mạng eduzone_backend của ứng dụng, nên phải dựng ứng dụng trước.
#
#   Máy cá nhân: docker compose -f observability/monitoring/docker-compose.yml up -d
#   Máy chủ:     (deploy.sh tự chạy) docker compose --env-file .env -f monitoring/docker-compose.yml up -d
#
# Chỉ mở cổng trên 127.0.0.1: Grafana đi qua Nginx (/grafana/), Prometheus xem qua đường hầm SSH.
name: eduzone-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [backend]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro
    networks: [backend]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    mem_limit: 384m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_local}
      # Grafana chạy dưới đường dẫn /grafana/ phía sau Nginx
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Xem dashboard không cần đăng nhập (chỉ quyền Viewer)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/eduzone.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    networks: [backend]

networks:
  backend:
    name: eduzone_backend
    external: true

volumes:
  prometheus-data:
  grafana-data:
