groups:
  - name: eduzone
    rules:
      - alert: ServiceDown
        expr: up{job=~"eduzone-services|gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} không phản hồi Prometheus quá 1 phút"

      - alert: HighHttpErrorRate
        expr: |
          sum by (service) (rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator.*"}[5m]))
            /
          sum by (service) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
            > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }}: hơn 5% request trả lỗi 5xx trong 5 phút"

      - alert: HighEnrollmentCancelRate
        expr: |
          sum(rate(eduzone_enrollments_total{status="cancelled"}[10m]))
            /
          sum(rate(eduzone_enrollments_total[10m]))
            > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hơn 50% ghi danh bị huỷ trong 10 phút — kiểm tra lớp bị khoá hoặc ví học viên"
