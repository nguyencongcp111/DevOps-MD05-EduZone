server:
  port: 8081

spring:
  application:
    name: course-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eduzone_course_db}
    username: ${DB_USER:course_user}
    password: ${DB_PASSWORD:course_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    # Ẩn các dòng WARN vô hại của Hibernate lúc tạo bảng, tránh nhiễu khi lọc log theo mức WARN.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR
