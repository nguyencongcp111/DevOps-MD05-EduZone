server:
  port: 8080

spring:
  application:
    name: gateway

eduzone:
  routes:
    course-url: ${COURSE_SERVICE_URL:http://localhost:8081}
    student-url: ${STUDENT_SERVICE_URL:http://localhost:8082}
    enrollment-url: ${ENROLLMENT_SERVICE_URL:http://localhost:8083}
    access-url: ${ACCESS_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
